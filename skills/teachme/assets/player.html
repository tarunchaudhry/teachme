<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning: calm, unhurried, easy on the eyes for long sessions
   IDEA a field notebook: warm paper, moss-green ink, an amber highlighter on what matters
   PICTURE the lesson's live diagram (keyed SVG scene) or the course concept map, large
   COLOUR paper #f7f4ee, ink #2b2a26, moss #3d6a4b, highlighter #f3d675, brick #a9442a for misses; night #161916 with warm ink #e3dfd5
   TYPE Fraunces display, Literata for reading, Atkinson Hyperlegible for controls and labels
   LAYOUT laptop: lesson rail | picture beside text; phone: title, picture, text, sticky step bar */
:root{color-scheme:light dark;--fs:18px;--bg:light-dark(#f7f4ee,#161916);--ink:light-dark(#2b2a26,#e3dfd5);--soft:light-dark(#625e55,#a6a397);--line:light-dark(#e2ddd2,#2c312b);--panel:light-dark(#eeebe2,#1e231e);--card:light-dark(#fffdf9,#1b1f1b);--pri:light-dark(#3d6a4b,#94c4a0);--prid:light-dark(#2f5a3c,#a9d3b3);--cover:light-dark(#f7f4ee,#161916);--hl:light-dark(#f6e3a1,#4d4220);--hlink:light-dark(#e9bf3f,#d9b24a);--amber:light-dark(#b9801a,#e0b45a);--ok:light-dark(#2f7a4c,#7fcf98);--miss:light-dark(#a9442a,#ee8a6c);--onc:light-dark(#fffdf9,#13160f);--ui:"Atkinson Hyperlegible",system-ui,sans-serif;--read:Literata,Georgia,serif;--disp:Fraunces,Georgia,serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--ui);overflow-x:clip;-webkit-font-smoothing:antialiased}
.body,.fb,.card p,.hero p,.flash,.we{font-family:var(--read);font-size:var(--fs);line-height:1.72}
.body{max-width:66ch}
h1,h2,h3{font-family:var(--disp);font-weight:650;line-height:1.1;letter-spacing:-.01em;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(30px,4.4vw,48px)}h2{font-size:clamp(24px,3vw,32px)}h3{font-size:20px}
a{color:var(--pri)}
button,.btn{font:inherit;font-family:var(--ui);font-size:16px;min-height:44px;padding:8px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--pri)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--hlink);outline-offset:2px}
.pri{background:var(--pri);border-color:var(--pri);color:var(--onc);font-weight:700}
.pri:hover{background:var(--prid);border-color:var(--prid)}
.sz{min-width:44px;padding:6px 8px;font-weight:700}
.ghost{border-color:transparent;background:transparent;color:var(--pri)}
input[type=text],input[type=number],textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:96px}
input[type=range]{width:100%;accent-color:var(--pri);height:32px}
mark{background:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 88%,transparent 88%);color:inherit;padding:0 .12em}
code{background:var(--panel);padding:.1em .35em;border-radius:5px;font-size:.92em;overflow-wrap:anywhere}
.cover{background:var(--cover);color:var(--ink);border-bottom:1px solid var(--line);padding:12px max(4vw,16px);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cover a{color:var(--pri);text-decoration:none;font-family:var(--disp);font-weight:700;font-size:19px}
.cover nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.cover nav a{font-family:var(--ui);font-weight:400;font-size:15px;color:var(--ink);padding:8px 12px;border-radius:999px;background:transparent}
.cover nav a:hover{background:var(--panel)}
.cover nav a.on{background:var(--hl);color:var(--ink);font-weight:700}
.wrap{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);max-width:1320px;margin:0 auto}
.rail{border-right:1px solid var(--line);padding:20px 16px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
.rail h4{margin:16px 0 6px;font-size:14px;color:var(--soft);font-weight:700}
.rail a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:15px;line-height:1.3}
.rail a.on{background:var(--panel);font-weight:700}
.rail a.lock{color:var(--soft)}
.dot{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--soft)}
.dot.go{border-color:var(--pri)}.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.half{background:linear-gradient(90deg,var(--hlink) 50%,transparent 50%);border-color:#c9a400}
main{padding:24px max(3vw,16px) 120px}
.menu{display:none}
.phases{display:flex;gap:4px;margin:0 0 18px;flex-wrap:wrap}
.ph{flex:1 1 70px;font-size:13px;color:var(--soft);border-top:4px solid var(--line);padding-top:6px}
.ph.done{border-color:color-mix(in srgb,var(--pri) 45%,var(--line))}.ph.on{border-color:var(--pri);color:var(--ink);font-weight:700}
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.stage.solo{grid-template-columns:minmax(0,760px)}
.fig{position:relative;min-height:340px;background:var(--panel);border-radius:16px;overflow:hidden}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.figwrap{position:sticky;top:16px}
.cap{font-size:14px;color:var(--soft);margin:8px 2px 0}
.body p{margin:0 0 .8em}.body ul,.body ol{padding-left:1.2em;margin:0 0 .8em}
.kicker{font-size:14px;color:var(--pri);font-weight:700;margin-bottom:4px}
.callout{background:color-mix(in srgb,var(--hl) 70%,var(--card));border-left:4px solid var(--hlink);border-radius:12px;padding:12px 16px;margin:12px 0}
.note{font-size:14px;color:var(--soft)}
.badge{display:inline-block;font-size:13px;padding:2px 8px;border-radius:999px;background:var(--panel);color:var(--soft);margin-right:6px}
.badge.ill{background:var(--hl);color:var(--ink)}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;background:var(--card)}
.card.q h3{font-size:18px;font-family:inherit;letter-spacing:0;font-weight:700}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:6px 0;line-height:1.4}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 8%,var(--bg))}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--bg))}
.opt.wrong{border-color:var(--miss);background:color-mix(in srgb,var(--miss) 10%,var(--bg))}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel)}
.fb b.ok{color:var(--ok)}.fb b.no{color:var(--miss)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ord{display:flex;gap:8px;align-items:center;margin:6px 0;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px}
.ord span{flex:1}.ord button{min-height:36px;padding:2px 10px}
.we li{margin:8px 0}.sub{font-weight:700;color:var(--pri)}
.simout{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:10px;margin:10px 0}
.simout div{background:var(--panel);border-radius:10px;padding:10px}
.simout b{display:block;font-family:var(--disp);font-size:clamp(22px,3vw,30px);white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px max(4vw,16px)}
.bar .row{max-width:1100px;margin:0 auto;justify-content:space-between}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;align-items:center;margin-bottom:28px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8em,1fr));gap:10px;margin:16px 0}
.stats div{background:var(--panel);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-family:var(--disp);font-size:26px}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.mod{background:var(--panel);border-radius:14px;padding:16px}
.mod a{display:flex;gap:10px;align-items:center;padding:8px 4px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.mod a:last-child{border-bottom:0}.mod small{margin-left:auto;color:var(--soft);white-space:nowrap}
.flash{min-height:220px;display:grid;place-items:center;text-align:center;font-size:20px;background:var(--panel);border-radius:16px;padding:24px;margin:12px 0}
.flash .back{border-top:2px dashed var(--line);margin-top:14px;padding-top:14px;font-size:17px}
.rate button small{display:block;font-size:12px;color:var(--soft)}
.scroll{overflow-x:auto}
.its{list-style:none;margin:8px 0 0;padding:0}.its li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.its li:last-child{border-bottom:0}.its small{margin-left:auto;color:var(--soft);white-space:nowrap}
.plan{display:grid;gap:10px}.sess{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}.sess.today{border:2px solid var(--pri)}.sd b{display:block;font-family:var(--disp);font-size:18px}.sd small{color:var(--soft)}.sess .its{margin:0}
.paces{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:10px}.pace{display:grid;gap:2px;padding:12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;min-height:44px}.pace.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 8%,var(--card))}.pace input{position:absolute;opacity:0}.pace small{color:var(--soft)}.pace:focus-within{outline:3px solid var(--hlink)}
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:16px;margin-top:16px}.pform label{display:grid;gap:6px}select,input[type=date]{font:inherit;font-size:16px;min-height:44px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.plan-today{margin-top:0}
@media(max-width:600px){.sess{grid-template-columns:minmax(0,1fr);gap:4px}}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
blockquote{margin:6px 0;padding:6px 12px;border-left:4px solid var(--hlink);background:var(--panel);border-radius:0 8px 8px 0}
svg text{font-family:var(--ui);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.n{transition:transform .6s cubic-bezier(.3,.7,.2,1),opacity .4s}
.edges{transition:opacity .3s}
@media(prefers-reduced-motion:reduce){.n,.edges{transition:none}.pk{display:none}}
@media(max-width:900px){.stage,.hero{grid-template-columns:minmax(0,1fr)}.figwrap{position:static}.stage.sim .figwrap{order:2}}
@media(max-width:600px){.cover{display:grid;grid-template-columns:auto minmax(0,1fr) auto;row-gap:6px;padding-block:8px}.cover nav{grid-column:1/-1;margin:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.cover nav a{flex:none}.szg{gap:0;grid-row:1;grid-column:3}.cover>a{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sz{min-width:40px}
.phases{flex-wrap:nowrap}.ph{flex:1 1 0;font-size:0}.ph.on{flex:3 1 0;font-size:13px}}
@media(max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}.rail{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);max-height:none}.rail.open{display:block}.menu{display:inline-flex}.fig{min-height:260px}}
</style>
</head>
<body>
<header class="cover"><button class="menu ghost" id="menuBtn">Lessons</button><a href="#home" id="brand"></a><nav id="topnav"></nav><div class="row szg" role="group" aria-label="Text size"><button class="ghost sz" id="szm" aria-label="Smaller text">A−</button><button class="ghost sz" id="szp" aria-label="Larger text">A+</button></div></header>
<div class="wrap"><aside class="rail" id="rail"></aside><main id="main"></main></div>
<script type="application/json" id="course">/*__COURSE_JSON__*/</script>
<script>
{
const C = JSON.parse(document.getElementById('course').textContent);
const PH = ['hook','activate','explain','worked_example','guided_practice','retrieval','teachback','review'];
const PHL = {hook:'Hook',activate:'Pretest',explain:'Explain',worked_example:'Worked example',guided_practice:'Practice',retrieval:'Quiz',teachback:'Teach-back',review:'Review'};
const MASTERY = C.mastery || 0.8;
const KEY = 'teachme:' + C.id;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lessons = C.lessons || [];
const L = Object.fromEntries(lessons.map(l => [l.id, l]));
const srcById = Object.fromEntries((C.sources || []).map(s => [s.id, s]));
const order = (C.modules || []).flatMap(m => m.lessons);

/* ---------- state ---------- */
let S = {lessons:{}, cards:{}, tests:[], last:null};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
if (window.claude?.hot?.data?.S) S = window.claude.hot.data.S;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
window.claude?.hot?.snapshot?.(() => ({S}));
const LS = id => (S.lessons[id] ||= {step:0, answers:{}, done:false});

/* ---------- markdown (small, safe) ---------- */
function inline(t){
  return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/==([^=]+)==/g,'<mark>$1</mark>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(blocks){
  return (Array.isArray(blocks)?blocks:[blocks]).map(b => {
    const lines = String(b).split('\n');
    if (lines.every(x => /^\s*[-*] /.test(x))) return '<ul>' + lines.map(x => '<li>' + inline(x.replace(/^\s*[-*] /,'')) + '</li>').join('') + '</ul>';
    if (lines.every(x => /^\s*\d+[.)] /.test(x))) return '<ol>' + lines.map(x => '<li>' + inline(x.replace(/^\s*\d+[.)] /,'')) + '</li>').join('') + '</ol>';
    return '<p>' + inline(b).replace(/\n/g,'<br>') + '</p>';
  }).join('');
}
const plain = s => String(s).replace(/[*=`#>\[\]]/g,'').replace(/\((https?:[^)]+)\)/g,'');

/* ---------- safe expression evaluator (same grammar as validate.py) ---------- */
const FN = {exp:Math.exp,log:Math.log,ln:Math.log,log10:Math.log10,log2:Math.log2,sqrt:Math.sqrt,abs:Math.abs,min:Math.min,max:Math.max,round:Math.round,floor:Math.floor,ceil:Math.ceil,pow:Math.pow,sin:Math.sin,cos:Math.cos,tanh:Math.tanh,sigmoid:x=>1/(1+Math.exp(-x))};
function evalExpr(src, vars){
  const tk = []; const re = /\s*(\d+\.?\d*(?:e[+-]?\d+)?|\.\d+|[A-Za-z_]\w*|\*\*|[-+*/^(),])/gy; let m, i = 0;
  while (i < src.length) { re.lastIndex = i; m = re.exec(src); if (!m) { if (/^\s*$/.test(src.slice(i))) break; throw Error('bad token at ' + i); } tk.push(m[1]); i = re.lastIndex; }
  let p = 0; const peek = () => tk[p], next = () => tk[p++];
  const prim = () => { const t = next();
    if (t === '(') { const v = add(); if (next() !== ')') throw Error(') expected'); return v; }
    if (t === '-') return -pw(); if (t === '+') return pw();
    if (/^[\d.]/.test(t)) return parseFloat(t);
    if (/^[A-Za-z_]/.test(t)) {
      if (peek() === '(') { next(); const a = []; if (peek() !== ')') { a.push(add()); while (peek() === ',') { next(); a.push(add()); } } next(); if (!FN[t]) throw Error('unknown fn ' + t); return FN[t](...a); }
      if (t === 'pi') return Math.PI; if (t === 'e') return Math.E;
      if (!(t in vars)) throw Error('unknown var ' + t); return +vars[t]; }
    throw Error('unexpected ' + t); };
  const pw = () => { const b = prim(); if (peek() === '^' || peek() === '**') { next(); return Math.pow(b, un()); } return b; };
  const un = () => { if (peek() === '-') { next(); return -un(); } return pw(); };
  const mul = () => { let v = un(); while (peek() === '*' || peek() === '/') { const o = next(), r = un(); v = o === '*' ? v * r : v / r; } return v; };
  const add = () => { let v = mul(); while (peek() === '+' || peek() === '-') { const o = next(), r = mul(); v = o === '+' ? v + r : v - r; } return v; };
  const v = add(); if (p < tk.length) throw Error('trailing ' + tk[p]); return v;
}
const fmt = (v, d) => { if (!isFinite(v)) return '—'; const dd = d ?? (Math.abs(v) >= 100 ? 0 : Math.abs(v) >= 1 ? 2 : 3); return v.toLocaleString(undefined,{maximumFractionDigits:dd,minimumFractionDigits:0}); };

/* ---------- FSRS-4.5 style scheduler (default parameters, day granularity) ---------- */
const W = [0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const RET = C.desiredRetention || 0.9, DECAY = -0.5, FACTOR = 19/81, DAY = 864e5;
const clampD = d => Math.min(10, Math.max(1, d));
const ivl = s => Math.max(1, Math.round(s / FACTOR * (Math.pow(RET, 1/DECAY) - 1)));
function fsrs(card, g, now){
  const c = Object.assign({}, card);
  if (!c.reps) { c.s = W[g-1]; c.d = clampD(W[4] - (g-3)*W[5]); }
  else {
    const t = Math.max(0, (now - c.last) / DAY), r = Math.pow(1 + FACTOR * t / c.s, DECAY);
    const d0 = W[4]; c.d = clampD(W[7]*d0 + (1-W[7])*(c.d - W[6]*(g-3)));
    if (g === 1) c.s = W[11]*Math.pow(c.d,-W[12])*(Math.pow(c.s+1,W[13])-1)*Math.exp(W[14]*(1-r));
    else c.s = c.s*(Math.exp(W[8])*(11-c.d)*Math.pow(c.s,-W[9])*(Math.exp(W[10]*(1-r))-1)*(g===2?W[15]:1)*(g===4?W[16]:1)+1);
  }
  c.reps = (c.reps||0)+1; c.last = now; c.lapses = (c.lapses||0) + (g===1?1:0);
  c.due = g === 1 ? now + 10*60e3 : now + ivl(c.s) * DAY;
  return c;
}
const human = ms => { const m = ms/60e3; return m < 60 ? Math.round(m)+'m' : m < 1440 ? Math.round(m/60)+'h' : Math.round(m/1440)+'d'; };
const allCards = () => lessons.flatMap(l => (l.flashcards||[]).map(f => Object.assign({lesson:l.id}, f)));
const dueCards = () => allCards().filter(f => S.cards[f.id] && S.cards[f.id].due <= Date.now());

/* ---------- scene engine: keyed snapshots, enter/update/exit ---------- */
const TONE = {main:'var(--pri)',accent:'var(--amber)',muted:'var(--soft)',ok:'var(--ok)',warn:'var(--miss)'};
function SceneView(fig){
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS,'svg'); fig.appendChild(svg);
  svg.innerHTML = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--soft)"/></marker></defs><g class="grp"></g><g class="edges"></g><g class="nodes"></g>';
  const gN = svg.querySelector('.nodes'), gE = svg.querySelector('.edges'), gG = svg.querySelector('.grp');
  const els = {}; let scene = null, geo = {};
  function size(n, Wd){ const fs = Wd < 520 ? 13 : 15; const lines = String(n.label).split('\n'); const w = n.w ? n.w/100*Wd : Math.max(...lines.map(x=>x.length))*fs*0.56 + 28; return {w:Math.max(n.shape==='circle'?56:70,w), h:(n.h?n.h/100*svg.clientHeight:lines.length*fs*1.25+20), fs, lines}; }
  function shape(n, z){ const f = TONE[n.tone||'main'], w=z.w, h=z.h, fill=`color-mix(in srgb, ${f} 16%, var(--bg))`;
    if (n.shape === 'circle') { const r = Math.max(w,h)/2; z.w = z.h = 2*r; return `<circle r="${r}" fill="${fill}" stroke="${f}" stroke-width="2.5"/>`; }
    if (n.shape === 'diamond') return `<path d="M0 ${-h/2-8}L${w/2+10} 0L0 ${h/2+8}L${-w/2-10} 0Z" fill="${fill}" stroke="${f}" stroke-width="2.5"/>`;
    if (n.shape === 'cylinder') return `<path d="M${-w/2} ${-h/2+6}v${h-12}a${w/2} 7 0 0 0 ${w} 0v${-(h-12)}" fill="${fill}" stroke="${f}" stroke-width="2.5"/><ellipse cy="${-h/2+6}" rx="${w/2}" ry="7" fill="${fill}" stroke="${f}" stroke-width="2.5"/>`;

  function edgePt(a, b){ const dx=b.x-a.x, dy=b.y-a.y; if(!dx&&!dy) return {x:a.x,y:a.y}; const sx=(a.w/2+4)/Math.abs(dx||1e-9), sy=(a.h/2+4)/Math.abs(dy||1e-9), s=Math.min(sx,sy,1); return {x:a.x+dx*s,y:a.y+dy*s}; }

/* ---------- quizzes ---------- */
function quizHTML(q, store, opts={}){
  const a = store[q.id]; const done = a && a.done;
  let h = `<div class="card q" data-q="${q.id}"><h3>${inline(q.prompt)}</h3>`;
  if (q.type === 'mcq' || q.type === 'multi') {
    h += q.options.map((o,i) => { let c = 'opt'; const sel = a?.sel?.includes(i); if (sel) c += ' sel';
      if (done) { const right = q.type==='mcq' ? i===q.answer : q.answer.includes(i); if (right) c+=' right'; else if (sel) c+=' wrong'; }
      return `<button class="${c}" data-opt="${i}" ${done?'disabled':''}><span>${String.fromCharCode(65+i)}.</span><span>${inline(o)}</span></button>`; }).join('');
    if (q.type === 'multi' && !done) h += `<button class="pri" data-check>Check</button>`;
  } else if (q.type === 'numeric' || q.type === 'cloze') {
    h += `<div class="row"><input type="${q.type==='numeric'?'number':'text'}" step="any" id="in-${q.id}" value="${esc(a?.val??'')}" ${done?'disabled':''} style="max-width:260px" placeholder="${q.type==='numeric'?'Your number':'Your answer'}">${q.unit?`<span>${esc(q.unit)}</span>`:''}${done?'':'<button class="pri" data-check>Check</button>'}</div>`;
  } else if (q.type === 'order') {
    const cur = a?.ord || shuffle(q.items.map((_,i)=>i), q.id);
    h += cur.map((ix,k) => `<div class="ord"><b>${k+1}</b><span>${inline(q.items[ix])}</span>${done?'':`<button data-up="${k}" aria-label="Move up">↑</button><button data-dn="${k}" aria-label="Move down">↓</button>`}</div>`).join('');
    if (!done) h += `<button class="pri" data-check>Check order</button>`;
    store[q.id] = Object.assign(a||{}, {ord:cur});
  } else if (q.type === 'recall') {
    h += `<textarea id="in-${q.id}" ${done?'disabled':''} placeholder="Answer from memory first, in your own words">${esc(a?.val??'')}</textarea>`;
    if (!a?.shown) h += `<div class="row" style="margin-top:8px"><button class="pri" data-show>Show model answer</button></div>`;
    else { h += `<div class="fb"><b>Model answer</b>${md(q.answer)}</div>`; if (!done) h += `<p class="note">How did you do?</p><div class="row"><button data-self="1">Got it</button><button data-self="0.5">Partly</button><button data-self="0">Missed it</button></div>`; }
  }
  if (done) { const ok = a.score >= 1; h += `<div class="fb"><b class="${ok?'ok':'no'}">${ok?'Correct.':a.score>0?'Partly right.':(opts.pretest?'Not yet, and that is fine.':'Not quite.')}</b> ${q.type!=='recall'&&!ok?answerText(q):''} ${md(q.explanation||'')}</div>`; }
  return h + '</div>';
}
function answerText(q){ if (q.type==='mcq') return 'Answer: ' + inline(q.options[q.answer]) + '. '; if (q.type==='multi') return 'Answer: ' + q.answer.map(i=>String.fromCharCode(65+i)).join(', ') + '. ';
  if (q.type==='numeric') return `Answer: ${fmt(q.answer)}${q.unit?' '+esc(q.unit):''}. `; if (q.type==='cloze') return 'Answer: ' + esc(q.accept[0]) + '. '; if (q.type==='order') return 'Order: ' + q.items.map((t,i)=>(i+1)+'. '+inline(t)).join(' ') + ' '; return ''; }
function shuffle(arr, seed){ let s = [...String(seed)].reduce((a,c)=>a*31+c.charCodeAt(0)|0, 7) || 1; const r = () => (s = s*16807 % 2147483647) / 2147483647; const o = arr.slice(); for (let i=o.length-1;i>0;i--){ const j = Math.floor(Math.abs(r())*(i+1)); [o[i],o[j]]=[o[j],o[i]]; } if (o.every((v,i)=>v===i) && o.length>1) o.reverse(); return o; }
function bindQuiz(root, qs, store, rerender){
  root.querySelectorAll('[data-q]').forEach(el => { const q = qs.find(x => x.id === el.dataset.q); if (!q) return; const a = store[q.id] ||= {};
    const finish = sc => { a.done = true; a.score = sc; save(); rerender(); };
    el.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { const i = +b.dataset.opt;
      if (q.type === 'mcq') { a.sel = [i]; finish(i === q.answer ? 1 : 0); }
      else { a.sel = a.sel || []; a.sel = a.sel.includes(i) ? a.sel.filter(x=>x!==i) : [...a.sel, i]; b.classList.toggle('sel'); } });
    el.querySelector('[data-check]')?.addEventListener('click', () => {
      if (q.type === 'multi') { const s = new Set(a.sel||[]); finish(q.answer.length === s.size && q.answer.every(i=>s.has(i)) ? 1 : 0); }

      else if (q.type === 'order') { finish(a.ord.every((v,i)=>v===i) ? 1 : 0); } });

const score = (qs, store) => { const d = qs.filter(q => store[q.id]?.done); return {n:qs.length, done:d.length, pts:d.reduce((s,q)=>s+store[q.id].score,0)}; };

function drawMap(fig){
  const cm = C.conceptMap; if (!cm?.nodes?.length) { fig.style.display='none'; return; }

  const dep = (id, seen=new Set()) => { if (depth[id]!=null) return depth[id]; if (seen.has(id)) return 0; seen.add(id); return depth[id] = Math.max(-1, ...pre(id).map(p=>dep(p,seen)))+1; };
  cm.nodes.forEach(n=>dep(n.id)); const maxD = Math.max(...Object.values(depth)); const cols = {}; cm.nodes.forEach(n => (cols[depth[n.id]] ||= []).push(n));

    c.sort((a,b) => { const m = n => { const p = pre(n.id).map(x=>pos[x]).filter(v=>v!=null); return p.length ? p.reduce((s,v)=>s+v,0)/p.length : 50; }; return m(a)-m(b); });

}

function lesson(id){

function claimHTML(c){ return `<div style="margin:10px 0"><span class="badge ${c.kind==='illustrative'?'ill':''}">${esc(c.kind)}</span>${inline(c.text)}${(c.support||[]).map(s => { const src = srcById[s.sourceId]; const q = src?.quotes?.find(x=>x.id===s.quoteId); return q ? `<blockquote>“${esc(q.text)}”<br><span class="note">${src.url?`<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.title)}</a>`:esc(src.title)}</span></blockquote>` : ''; }).join('')}${c.kind==='illustrative'?'<div class="note">Made-up numbers to show the idea, not real data.</div>':''}</div>`; }

/* ---------- learning pace planner ---------- */
const DEFAULT_PACE = Object.assign({mode:'daily', minutes:30, perWeek:3, retain:'month', deadline:''}, C.pace || {});
const getPace = () => Object.assign({}, DEFAULT_PACE, S.pace || {});
const RETAIN = {week:{label:'about a week', after:[1,3,6]}, month:{label:'a month or two', after:[1,4,10,24]}, year:{label:'a year or more', after:[1,7,21,60,120]}};
const dayStart = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtDay = d => d.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'});
function buildPlan(pace){
  const today = dayStart(Date.now()), todo = order.filter(id => L[id] && !S.lessons[id]?.done).map(id => L[id]);
  const cps = (C.checkpoints||[]).filter(c => !S.lessons['c-'+c.id]?.done);
  const sessions = [], notes = [];
  let dates;
  if (pace.mode === 'today') dates = [today];
  else if (pace.mode === 'weekly') { const gap = 7 / Math.max(1, Math.min(7, pace.perWeek)); dates = Array.from({length:60}, (_,i) => addDays(today, Math.round(i*gap))); }
  else if (pace.mode === 'deadline' && pace.deadline) { const end = dayStart(pace.deadline); const n = Math.max(1, Math.round((end - today)/DAY)); dates = Array.from({length:n}, (_,i) => addDays(today, i)); }
  else dates = Array.from({length:120}, (_,i) => addDays(today, i));
  const budget = pace.mode === 'today' ? Infinity : Math.max(10, +pace.minutes || 30);
  let li = 0, studied = Object.values(S.lessons).some(x => x.done), di = 0, sinceBreak = 0;
  while (li < todo.length && di < dates.length) {
    const items = []; let left = budget;
    if (studied && pace.mode !== 'today') { const r = Math.min(15, Math.max(5, Math.round(budget*0.2))); items.push({kind:'review', min:r}); left -= r; }
    while (li < todo.length) { const l = todo[li], m = l.minutes || 18;
      if (m > left && items.some(x => x.kind === 'lesson')) break;
      if (pace.mode === 'today' && sinceBreak + m > 50 && items.length) { items.push({kind:'break', min:10}); sinceBreak = 0; }
      items.push({kind:'lesson', id:l.id, title:l.title, min:m}); left -= m; sinceBreak += m; li++; studied = true;
      cps.filter(c => c.afterLesson === l.id).forEach(c => { items.push({kind:'checkpoint', id:c.id, title:c.title, min:6}); left -= 6; });
      if (left <= 0) break; }
    sessions.push({date:dates[di], items}); di++;
  }
  if (li < todo.length) { const need = Math.ceil(todo.reduce((s,l)=>s+(l.minutes||18),0) / Math.max(1, dates.length)) + 10;
    notes.push(`This pace can't fit every lesson before your date. You'd need about ${need} minutes a session, or a later date.`); }
  const lastLesson = sessions.length ? sessions[sessions.length-1].date : today;
  let after = (RETAIN[pace.retain] || RETAIN.month).after.slice();
  if (pace.mode === 'deadline' && pace.deadline) { const end = dayStart(pace.deadline), room = Math.round((end - lastLesson)/DAY);
    after = after.filter(a => a < room); if (room >= 2) after.push(room - 1); }
  const firstDay = sessions[0]?.date || today;
  after.forEach(a => { const d = addDays(lastLesson, a); const ex = sessions.find(x => +x.date === +d);
    const item = {kind:'review', min:pace.mode==='today'?10:Math.min(15, Math.max(5, Math.round(budget*0.3)))};
    if (ex) { if (!ex.items.some(i=>i.kind==='review')) ex.items.unshift(item); } else sessions.push({date:d, items:[item]}); });
  const td = pace.mode === 'deadline' && pace.deadline ? addDays(dayStart(pace.deadline), -1) : addDays(firstDay, 7);
  const tsess = sessions.find(x => +x.date === +td) || (sessions.push({date:td, items:[]}), sessions[sessions.length-1]);
  tsess.items.push({kind:'test', min:10, final: pace.mode === 'deadline' && !!pace.deadline});
  sessions.sort((a,b) => a.date - b.date);
  const longest = Math.max(0, ...todo.map(l => l.minutes || 18));
  if (pace.mode !== 'today' && longest + 5 > budget) notes.push(`Lessons take up to ${longest} minutes, so some sessions run over ${budget}. Your place is saved, so you can stop mid-lesson and pick it up next time.`);

  if (pace.mode === 'deadline' && pace.deadline) notes.push('Lessons come first, then reviews at growing gaps, with a mixed test the day before your date.');

}

  lessons.forEach(l => { if (S.lessons[l.id]?.done && !S.lessons[l.id].doneAt) { S.lessons[l.id].doneAt = Date.now(); save(); } });
  const t = S.curTest ||= {answers:{}, items:null};
  if (!pool.length) { $('#main').innerHTML = `<h1>1-week test</h1><p>Finish at least one lesson first. A week later, this mixed test shows what you actually kept, which is the honest measure of learning.</p>`; topnav('test'); rail(''); return; }
  const ready = isFinite(first) && Date.now() - first >= 7*DAY;
  if (!t.items) { if (!ready && !t.force) { $('#main').innerHTML = `<h1>1-week test</h1><p>Best taken from <b>${isFinite(first)?new Date(first+7*DAY).toDateString():'a week after your first lesson'}</b>. Testing a week later, without rereading, shows what really stuck.</p><button data-force>Take it now anyway</button>${(S.tests||[]).map(x=>`<p class="note">${new Date(x.at).toDateString()}: ${Math.round(x.pct*100)}%</p>`).join('')}`; $('#main').querySelector('[data-force]').onclick = () => { t.force = true; save(); test(); }; topnav('test'); rail(''); return; }
    t.items = shuffle(pool.map((_,i)=>i), Date.now()).slice(0, 10).map(i => pool[i]); save(); }
  const sc = score(t.items, t.answers);
  $('#main').innerHTML = `<h1>1-week test</h1><p class="note">No notes, no rereading. ${sc.done}/${sc.n} answered.</p>${t.items.map(q=>quizHTML(q, t.answers)).join('')}${sc.done===sc.n?`<div class="callout"><b>${Math.round(sc.pts/sc.n*100)}%</b> after the delay. <button data-new>Finish and record</button></div>`:''}`;
  bindQuiz($('#main'), t.items, t.answers, test);
  $('#main').querySelector('[data-new]')?.addEventListener('click', () => { (S.tests ||= []).push({at:Date.now(), pct:sc.pts/sc.n}); S.curTest = null; save(); test(); });
  topnav('test'); rail(''); }

function sources(){
  $('#main').innerHTML = `<h1>Sources and claims</h1><p style="max-width:70ch">Every fact in this course is tied to an exact quote from a source below, and the quotes were checked word for word against the source text by a script. That proves the quote exists, not that the source is right or complete, so open the originals for anything that matters.</p>
  ${C.gaps?.length?`<div class="callout"><b>Gaps the sources did not cover:</b><ul>${C.gaps.map(g=>`<li>${inline(g)}</li>`).join('')}</ul></div>`:''}
  <h2>Sources</h2><div class="scroll"><table><thead><tr><th>Source</th><th>Kind</th><th>Quotes used</th></tr></thead><tbody>${(C.sources||[]).map(s=>`<tr><td>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`:esc(s.title)}</td><td>${esc(s.kind)}</td><td>${(s.quotes||[]).length}</td></tr>`).join('')}</tbody></table></div>
  <h2 style="margin-top:28px">Claims by lesson</h2>${lessons.map(l=>`<details class="card"><summary><b>${esc(l.title)}</b> · ${l.claims.length} claims</summary>${l.claims.map(claimHTML).join('')}</details>`).join('')}`;
  topnav('sources'); rail(''); }

function route(){ const h = location.hash.slice(1) || 'home'; $('#rail').classList.remove('open');
  if (h.startsWith('l-')) lesson(h.slice(2)); else if (h.startsWith('c-')) checkpoint(h.slice(2));
  else if (h === 'plan') planView(); else if (h === 'review') review(); else if (h === 'test') test(); else if (h === 'sources') sources(); else { home(); rail(''); topnav('home'); } }
let FS = 18; try { FS = +localStorage.getItem('teachme:fs') || 18; } catch (e) {}
const setFS = v => { FS = Math.max(15, Math.min(24, v)); document.documentElement.style.setProperty('--fs', FS + 'px'); try { localStorage.setItem('teachme:fs', FS); } catch (e) {} };
setFS(FS); $('#szm').onclick = () => setFS(FS - 1); $('#szp').onclick = () => setFS(FS + 1);
$('#brand').textContent = C.title; document.title = C.title;
$('#menuBtn').onclick = () => $('#rail').classList.add('open');
addEventListener('hashchange', route);
addEventListener('keydown', e => { if (e.target.closest('input,textarea')) return; const b = e.key==='ArrowRight' ? $('[data-nav="1"]') : e.key==='ArrowLeft' ? $('[data-nav="-1"]') : null; if (b && !b.disabled) b.click(); });
route();
}
</script>
</body>
